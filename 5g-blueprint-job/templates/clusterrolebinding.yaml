apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: 5g-blueprint-crb
subjects:
- namespace: {{ .Release.Namespace }}
  kind: ServiceAccount
  name: 5g-blueprint-service-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 5g-blueprint-crole
